services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: btg_lms
      POSTGRES_USER: btg
      POSTGRES_PASSWORD: btg_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btg -d btg_lms"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      BTG_LMS_DATABASE_URL: postgres://btg:btg_dev_password@db:5432/btg_lms?sslmode=disable
      BTG_LMS_HTTP_ADDR: :8080
      BTG_LMS_PUBLIC_ORIGIN: ${BTG_LMS_PUBLIC_ORIGIN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles: [app]
    command: ["serve"]
volumes:
  pgdata:
