    get:
      operationId: getAdministratorStatus
      description: Read-only proof of the instance.manage capability. Each request resolves the current session and active global role before authorization. No Administration mutation is exposed.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current actor may manage the instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatus'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Critical dependencies and schema are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    AuthoringOrigin: { name: Origin, in: header, required: true, schema: { type: string }, description: Trusted application Origin required for browser mutations. }
    AuthoringCSRFToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: CSRF token bound to the authenticated session. }
    AuthoringDraftID: { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringAssessmentID: { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
    LearnerAttemptID: { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    LearnerAssessmentKey: { name: assessmentKey, in: path, required: true, schema: { type: string, format: uuid } }
    CommunityThreadID: { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringUserID: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringModuleID: { name: moduleId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringLessonID: { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringReviewID: { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
    CourseID: { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
    CourseSlug: { name: slug, in: path, required: true, schema: { type: string } }
    CourseVersion: { name: version, in: path, required: true, schema: { type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$' } }
    LessonKey: { name: lessonKey, in: path, required: true, schema: { type: string } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when a valid btg_session cookie is present. Use the csrf_token from a no-store login or current-session response. This token is not an authentication credential.
      schema: { type: string }
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: btg_session
      description: Opaque server-side session token; HttpOnly, SameSite=Lax, Secure in production.
  responses:
    Problem:
      description: RFC 9457 Problem Details with request correlation ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AuthoringAsset:
      type: object
      additionalProperties: false
      required: [assetKey, filename, mediaType, byteSize, status]
      properties:
        assetKey: { type: string, format: uuid, description: Stable opaque Asset ID used by canonical LessonContent assetKey fields. }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string, description: Authoritative media type detected from the stored bytes. }
        byteSize: { type: integer, format: int64, minimum: 1 }
        status: { type: string, const: AVAILABLE }
    AuthoringAssetSummary:
      type: object
      additionalProperties: false
      required: [assetKey, filename, mediaType, byteSize, createdAt]
      properties:
        assetKey: { type: string, format: uuid }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mediaType: { type: string }
        byteSize: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
    AuthoringAssetList:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuthoringAssetSummary' } }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    AuthoringAssessmentOption:
      type: object
      additionalProperties: false
      required: [stableKey, text, position]
      properties:
        stableKey: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        text: { type: string, minLength: 1, maxLength: 4000 }
        position: { type: integer, minimum: 0 }
    AuthoringAssessmentMatchingItem:
      type: object
      additionalProperties: false
      required: [stableKey, text, position]
      properties:
        stableKey: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        text: { type: string, minLength: 1, maxLength: 4000 }
        position: { type: integer, minimum: 0 }
    AuthoringAssessmentMatchingPair:
      type: object
      additionalProperties: false
      required: [leftKey, rightKey]
      properties:
        leftKey: { type: string, minLength: 1, maxLength: 160 }
        rightKey: { type: string, minLength: 1, maxLength: 160 }
    AuthoringAssessmentQuestion:
      type: object
      additionalProperties: false
      required: [stableKey, type, prompt, position, options, correctOptionKeys, leftItems, rightItems, correctPairs]
      properties:
        stableKey: { type: string, minLength: 1, maxLength: 160, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        type: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, MATCHING] }
        prompt: { type: string, minLength: 1, maxLength: 10000 }
        position: { type: integer, minimum: 0 }
        options: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentOption' }, maxItems: 20 }
        correctOptionKeys: { type: array, items: { type: string, minLength: 1, maxLength: 160 }, maxItems: 20 }
        leftItems: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentMatchingItem' }, maxItems: 20 }
        rightItems: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentMatchingItem' }, maxItems: 20 }
        correctPairs: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentMatchingPair' }, maxItems: 20 }
    AuthoringAssessmentCreateRequest:
      type: object
      additionalProperties: false
      required: [title, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        questions: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentQuestion' }, maxItems: 100 }
    AuthoringAssessmentUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, questions]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        questions: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentQuestion' }, maxItems: 100 }
    AuthoringAssessmentDetail:
      type: object
      description: Private Authoring-only aggregate. It intentionally includes correct answer definitions and must never be reused for learner delivery.
      additionalProperties: false
      required: [assessmentKey, title, revision, questions, createdAt, updatedAt]
      properties:
        assessmentKey: { type: string, format: uuid }
        title: { type: string }
        revision: { type: integer, minimum: 1 }
        questions: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentQuestion' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthoringAssessmentSummary:
      type: object
      additionalProperties: false
      required: [assessmentKey, title, questionCount, revision, updatedAt]
      properties:
        assessmentKey: { type: string, format: uuid }
        title: { type: string }
        questionCount: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    AuthoringAssessmentList:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuthoringAssessmentSummary' } }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    LearnerAttemptID: { type: string, format: uuid }
    LearnerAssessmentAttemptResponsePair:
      type: object
      additionalProperties: false
      required: [leftItemKey, rightItemKey]
      properties:
        leftItemKey: { type: string, minLength: 1, maxLength: 160 }
        rightItemKey: { type: string, minLength: 1, maxLength: 160 }
    LearnerAssessmentAttemptResponse:
      type: object
      additionalProperties: false
      required: [questionKey, type, selectedOptionKey, selectedOptionKeys, pairs]
      properties:
        questionKey: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, MATCHING] }
        selectedOptionKey: { type: string }
        selectedOptionKeys: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 160 } }
        pairs: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/LearnerAssessmentAttemptResponsePair' } }
    LearnerAssessmentAttemptResult:
      type: object
      additionalProperties: false
      required: [correctCount, totalCount, percentage]
      properties:
        correctCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 1 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
    LearnerAssessmentAttempt:
      type: object
      description: Private learner-owned Attempt. It includes only the learner's own responses and aggregate score, never authoritative answers or Authoring provenance.
      additionalProperties: false
      required: [attemptId, assessmentKey, state, revision, responses, createdAt, updatedAt, submittedAt, result]
      properties:
        attemptId: { $ref: '#/components/schemas/LearnerAttemptID' }
        assessmentKey: { type: string, format: uuid }
        state: { type: string, enum: [IN_PROGRESS, SUBMITTED] }
        revision: { type: integer, minimum: 1 }
        responses: { type: array, items: { $ref: '#/components/schemas/LearnerAssessmentAttemptResponse' }, maxItems: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        result: { anyOf: [{ $ref: '#/components/schemas/LearnerAssessmentAttemptResult' }, { type: 'null' }] }
    LearnerAssessmentAttemptUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, responses]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        responses: { type: array, items: { $ref: '#/components/schemas/LearnerAssessmentAttemptResponse' }, maxItems: 100 }
    LearnerAssessmentAttemptSubmitRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    AuthoringReviewSubmitRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision]
      properties: { expectedDraftRevision: { type: integer, minimum: 1 } }
    AuthoringReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedReviewRevision]
      properties:
        expectedReviewRevision: { type: integer, minimum: 1 }
        message: { type: string, maxLength: 20000 }
    AuthoringPublicationRequest:
      type: object
      additionalProperties: false
      required: [expectedReviewRevision]
      properties: { expectedReviewRevision: { type: integer, minimum: 1 } }
    AuthoringPublication:
      type: object
      additionalProperties: false
      required: [reviewId, reviewRevision, courseId, courseVersion, courseVersionId, publishedAt]
      properties:
        reviewId: { type: string, format: uuid }
        reviewRevision: { type: integer, minimum: 1 }
        courseId: { type: string, format: uuid }
        courseVersion: { type: string, pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$' }
        courseVersionId: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
    PublicationValidationIssue:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code: { type: string, description: Stable publication-validation issue code. }
        path: { type: string, description: Deterministic canonical Review snapshot location. }
        message: { type: string, description: Safe human-readable issue detail. }
    PublicationValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [code, issues]
          properties:
            code: { type: string, const: publication_validation_failed }
            issues: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PublicationValidationIssue' } }
    PublicationConflictProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [review_revision_conflict, review_not_approved, course_version_already_exists, publication_conflict]
    AuthoringReview:
      type: object
      additionalProperties: false
      required: [id, draftId, draftRevision, snapshotSchemaVersion, status, reviewRevision, submittedBy, submittedAt, decidedBy, decidedAt]
      properties:
        id: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        draftRevision: { type: integer, minimum: 1 }
        snapshotSchemaVersion: { type: integer, const: 1 }
        status: { type: string, enum: [IN_REVIEW, APPROVED, CHANGES_REQUESTED] }
        reviewRevision: { type: integer, minimum: 1 }
        submittedBy: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
    AuthoringReviewList:
      type: object
      additionalProperties: false
      required: [reviews]
      properties: { reviews: { type: array, items: { $ref: '#/components/schemas/AuthoringReview' } } }
    AuthoringReviewDetail:
      type: object
      additionalProperties: false
      required: [review, snapshot, publication]
      properties:
        review: { $ref: '#/components/schemas/AuthoringReview' }
        snapshot: { $ref: '#/components/schemas/AuthoringReviewSnapshot' }
        publication: { $ref: '#/components/schemas/AuthoringReviewPublicationStatus' }
    AuthoringReviewSubmissionDetail:
      type: object
      additionalProperties: false
      required: [review, snapshot]
      properties:
        review: { $ref: '#/components/schemas/AuthoringReview' }
        snapshot: { $ref: '#/components/schemas/AuthoringReviewSnapshot' }
    AuthoringReviewPublicationStatus:
      type: object
      additionalProperties: false
      required: [canPublish, publishable, issues, published]
      description: Server-authoritative exact-Review publication readiness and safe publication state. canPublish represents the current actor's authoring.publish capability only; it does not replace endpoint authorization.
      properties:
        canPublish: { type: boolean }
        publishable: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/PublicationValidationIssue' } }
        published:
          type: [object, 'null']
          additionalProperties: false
          required: [courseId, courseVersion, publishedAt]
          properties:
            courseId: { type: string, format: uuid }
            courseVersion: { type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$' }
            publishedAt: { type: string, format: date-time }
    AuthoringReviewSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, draft, modules]
      properties:
        schemaVersion: { type: integer, const: 1 }
        draft: { $ref: '#/components/schemas/AuthoringReviewSnapshotDraft' }
        modules: { type: array, items: { $ref: '#/components/schemas/AuthoringReviewSnapshotModule' } }
    AuthoringReviewSnapshotDraft:
      type: object
      additionalProperties: false
      required: [id, revision, courseId, intendedVersion, sourceLanguage, title, description, objectives, changelog, license]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        courseId: { type: string, format: uuid }
        intendedVersion: { type: string }
        sourceLanguage: { type: string }
        title: { type: string }
        description: { type: string }
        objectives: { type: array, items: { type: string } }
        changelog: { type: string }
        license:
          type: object
          additionalProperties: false
          required: [Kind, Identifier, DisplayName, URL, CustomText]
          properties:
            Kind: { type: string, enum: [STANDARD, ALL_RIGHTS_RESERVED, CUSTOM] }
            Identifier: { type: string }
            DisplayName: { type: string }
            URL: { type: string }
            CustomText: { type: string }
    AuthoringReviewSnapshotModule:
      type: object
      additionalProperties: false
      required: [id, stableKey, title, description, position, lessons]
      properties:
        id: { type: string, format: uuid }
        stableKey: { type: string }
        title: { type: string }
        description: { type: string }
        position: { type: integer, minimum: 0 }
        lessons: { type: array, items: { $ref: '#/components/schemas/AuthoringReviewSnapshotLesson' } }
    AuthoringReviewSnapshotLesson:
      type: object
      additionalProperties: false
      required: [id, stableKey, title, description, objectives, estimatedDurationMinutes, position, prerequisiteStableKeys, content]
      properties:
        id: { type: string, format: uuid }
        stableKey: { type: string }
        title: { type: string }
        description: { type: string }
        objectives: { type: array, items: { type: string } }
        estimatedDurationMinutes: { type: [integer, 'null'] }
        position: { type: integer, minimum: 0 }
        prerequisiteStableKeys: { type: array, items: { type: string } }
        content: { $ref: '#/components/schemas/LessonContent' }
    AuthoringActiveMember:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
    AuthoringActiveMemberList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/AuthoringActiveMember' }
    AuthoringMemberAddRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, userId, role]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
    AuthoringMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, role]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
    AuthoringMemberRevokeRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
    AuthoringMemberMutationResponse:
      type: object
      required: [id, userId, role, createdAt, revokedAt, draftRevision]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        draftRevision: { type: integer, minimum: 1 }
    AuthoringLessonCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, stableKey, title, description, objectives, position]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        stableKey: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimatedDurationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0 }
    AuthoringLessonUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedLessonRevision]
      anyOf:
        - required: [title]
        - required: [description]
        - required: [objectives]
        - required: [estimatedDurationMinutes]
      properties:
        expectedLessonRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimatedDurationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
    AuthoringLessonOrderModule:
      type: object
      additionalProperties: false
      required: [moduleId, lessonIds]
      properties:
        moduleId: { type: string, format: uuid }
        lessonIds: { type: array, maxItems: 10000, uniqueItems: true, items: { type: string, format: uuid } }
    AuthoringLessonReorderRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, modules]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        modules: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/AuthoringLessonOrderModule' } }
    AuthoringLessonPrerequisitesRequest:
      type: object
      additionalProperties: false
      required: [expectedLessonRevision, prerequisiteLessonKeys]
      properties:
        expectedLessonRevision: { type: integer, minimum: 1 }
        prerequisiteLessonKeys: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 3, maxLength: 96 } }
    AuthoringLessonDeleteRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, expectedLessonRevision]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        expectedLessonRevision: { type: integer, minimum: 1 }
    AuthoringLessonContentUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedLessonRevision, content]
      properties:
        expectedLessonRevision: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/LessonContent' }
    AuthoringLessonContentMutationResponse:
      type: object
      required: [lesson, content]
      properties:
        lesson: { $ref: '#/components/schemas/AuthoringLessonMutationResponse' }
        content: { $ref: '#/components/schemas/LessonContent' }
    AuthoringLessonMutationResponse:
      type: object
      required: [id, draft_id, module_id, stable_key, title, description, objectives, estimated_duration_minutes, position, revision, draftRevision]
      properties:
        id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        module_id: { type: string, format: uuid }
        stable_key: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimated_duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        draftRevision: { type: integer, minimum: 1 }
    AuthoringModuleCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, stableKey, title, position]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        stableKey: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        position: { type: integer, minimum: 0 }
    AuthoringModuleUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedModuleRevision]
      anyOf:
        - required: [title]
        - required: [description]
      properties:
        expectedModuleRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
    AuthoringModuleReorderRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, moduleIds]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        moduleIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string, format: uuid } }
    AuthoringModuleDeleteRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, expectedModuleRevision]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        expectedModuleRevision: { type: integer, minimum: 1 }
    AuthoringModuleMutationResponse:
      type: object
      required: [module, draftRevision]
      properties:
        module: { $ref: '#/components/schemas/AuthoringModuleSummary' }
        draftRevision: { type: integer, minimum: 1 }
    AuthoringModuleOrderResponse:
      type: object
      required: [draftRevision]
      properties: { draftRevision: { type: integer, minimum: 1 } }
    AuthoringDraftUpdateRequest:
      type: object
      additionalProperties: false
