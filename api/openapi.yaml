      parameters:
        - { $ref: '#/components/parameters/CourseID' }
        - { $ref: '#/components/parameters/CourseVersion' }
        - name: assetKey
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Frozen published binary headers. }
        '304': { description: The immutable binary matches If-None-Match. }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
