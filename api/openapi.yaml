openapi: 3.1.0
info:
  title: BTG LMS application API
  version: 0.1.0
  description: Same-origin session transport API, public immutable published-course read API, and authenticated private Authoring reads and mutations. Authoring responses are no-store. Every Authoring mutation requires a trusted Origin and the authenticated session-bound CSRF token; unauthorized resources are hidden as 404.
paths:
  /api/authoring/drafts:
    get:
      operationId: listAuthoringDrafts
      description: Returns minimal mutable Draft summaries for which the authenticated actor currently has an active Authoring membership. Revoked memberships are excluded. Responses are private and not cacheable.
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Accessible Draft summaries ordered by most recently updated, then ID, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringDraftList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}:
    get:
      operationId: getAuthoringDraft
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Draft metadata and current revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringDraft' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAuthoringDraftMetadata
      description: Updates only mutable draft metadata using an explicit optimistic-concurrency revision. The request requires the authenticated session's CSRF token and a trusted same-origin Origin. Responses are private and not cacheable.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoringDraftUpdateRequest' }
      responses:
        '200': { description: Committed updated draft metadata with incremented revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringDraft' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/workspace:
    get:
      operationId: getAuthoringWorkspace
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Private workspace metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringWorkspace' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/modules:
    post:
      operationId: createAuthoringModule
      description: Creates one draft Module at a zero-based position using the current draft revision. The authenticated session must provide a valid CSRF token and trusted same-origin Origin.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoringModuleCreateRequest' }
      responses:
        '200': { description: Committed Module and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringModuleMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/members:
    get:
      operationId: listAuthoringActiveMembers
      description: Returns current active AUTHOR and MAINTAINER memberships for one Draft. The authenticated actor must have authoring.read. Revoked membership history is not exposed.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Active opaque Draft memberships ordered by user ID, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringActiveMemberList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addAuthoringMember
      description: Adds an active AUTHOR or MAINTAINER membership using the Draft revision. The authenticated actor must have authoring.members.manage.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringMemberAddRequest' } } }
      responses:
        '200': { description: Committed membership and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringMemberMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/members/{userId}:
    patch:
      operationId: changeAuthoringMemberRole
      description: Replaces one active member role. Demoting the final active MAINTAINER is rejected.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringUserID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringMemberRoleRequest' } } }
      responses:
        '200': { description: Committed active membership and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringMemberMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: revokeAuthoringMember
      description: Revokes one active membership while preserving history. Revoking the final active MAINTAINER is rejected.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringUserID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringMemberRevokeRequest' } } }
      responses:
        '200': { description: Revoked membership and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringMemberMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/modules/order:
    put:
      operationId: reorderAuthoringModules
      description: Atomically replaces the complete ordered Module ID list for one Draft. The list must contain every current Module exactly once.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoringModuleReorderRequest' }
      responses:
        '200': { description: Committed Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringModuleOrderResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/modules/{moduleId}:
    patch:
      operationId: updateAuthoringModule
      description: Updates title and description only. Stable key and position are immutable through PATCH.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringModuleID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoringModuleUpdateRequest' }
      responses:
        '200': { description: Committed Module and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringModuleMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAuthoringModule
      description: Deletes an empty Module only. Modules containing Lessons are rejected so the lesson cascade remains unavailable through this API.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringModuleID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoringModuleDeleteRequest' }
      responses:
        '200': { description: Committed Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringModuleOrderResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/modules/{moduleId}/lessons:
    post:
      operationId: createAuthoringLesson
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringModuleID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonCreateRequest' } } }
      responses:
        '200': { description: Committed Lesson metadata and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/lessons/order:
    put:
      operationId: reorderAuthoringLessons
      description: Atomically replaces the complete ordered Lesson structure for every Module in the Draft; this permits moves without changing Lesson identity or stable key.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonReorderRequest' } } }
      responses:
        '200': { description: Committed Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringModuleOrderResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/lessons/{lessonId}:
    get:
      operationId: getAuthoringLesson
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringLessonID' }]
      responses:
        '200': { description: Private draft lesson with canonical semantic content and current revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAuthoringLesson
      description: Updates Lesson metadata only. Stable key, Module, position, prerequisites, and content have separate boundaries.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringLessonID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonUpdateRequest' } } }
      responses:
        '200': { description: Committed Lesson metadata and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAuthoringLesson
      description: Deletes one draft Lesson and explicitly removes incoming advisory prerequisite relations, advancing affected source Lesson revisions.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringLessonID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonDeleteRequest' } } }
      responses:
        '200': { description: Committed Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringModuleOrderResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/lessons/{lessonId}/prerequisites:
    put:
      operationId: replaceAuthoringLessonPrerequisites
      description: Replaces the complete ordered advisory prerequisite stable-key list for one Lesson. Cycles are not evaluated in this slice.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringLessonID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonPrerequisitesRequest' } } }
      responses:
        '200': { description: Committed Lesson metadata and current Draft revision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/lessons/{lessonId}/content:
    put:
      operationId: replaceAuthoringLessonContent
      description: Atomically replaces the complete canonical semantic LessonContent document for one draft Lesson using its current revision. Editor state and partial block updates are not accepted.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringLessonID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonContentUpdateRequest' } } }
      responses:
        '200': { description: Committed canonical content and current Lesson and Draft revisions, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringLessonContentMutationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/structure:
    get:
      operationId: getAuthoringDraftStructure
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Ordered modules and lesson summaries without full lesson content, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringStructure' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews:
    get:
      operationId: listAuthoringDraftReviews
      description: Returns newest-first Review cycle metadata without historical snapshots.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Review history, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReviewList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      operationId: submitAuthoringDraftReview
      description: Atomically freezes the authoritative exact Draft revision. Requires trusted Origin and session CSRF token.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReviewSubmitRequest' } } } }
      responses:
        '201': { description: Frozen Review cycle, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReviewDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews/active:
    get:
      operationId: getActiveAuthoringDraftReview
      description: Returns the current IN_REVIEW cycle metadata; 404 when no active cycle exists.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Active Review metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews/latest:
    get:
      operationId: getLatestAuthoringDraftReview
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }]
      responses:
        '200': { description: Most recently submitted Review metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews/{reviewId}:
    get:
      operationId: getAuthoringDraftReview
      description: Returns immutable Review provenance and the exact stored canonical snapshot.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringReviewID' }]
      responses:
        '200': { description: Review and frozen snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReviewDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews/{reviewId}/approve:
    post:
      operationId: approveAuthoringDraftReview
      description: Terminally approves one IN_REVIEW cycle using Review revision CAS. Requires trusted Origin and session CSRF token. A configured independent-review policy rejection returns 409 with Problem code independent_reviewer_required; stale and terminal Review conflicts also return 409 without that code.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringReviewID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReviewDecisionRequest' } } } }
      responses:
        '200': { description: Approved Review metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews/{reviewId}/request-changes:
    post:
      operationId: requestAuthoringDraftReviewChanges
      description: Terminally requests changes on one IN_REVIEW cycle using Review revision CAS. Requires trusted Origin and session CSRF token. A configured independent-review policy rejection returns 409 with Problem code independent_reviewer_required; stale and terminal Review conflicts also return 409 without that code.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringReviewID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReviewDecisionRequest' } } } }
      responses:
        '200': { description: Change-requested Review metadata, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringReview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/authoring/drafts/{draftId}/reviews/{reviewId}/publish:
    post:
      operationId: publishAuthoringDraftReview
      description: Publishes the exact APPROVED Review revision through the Authoring publication orchestration boundary. Requires current authoring.publish authorization, trusted Origin, and the session CSRF token. Exact replay/reconciliation returns the same successful representation; stale Review state and a Course/SemVer owned by another Review return stable conflicts.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AuthoringDraftID' }, { $ref: '#/components/parameters/AuthoringReviewID' }, { $ref: '#/components/parameters/AuthoringOrigin' }, { $ref: '#/components/parameters/AuthoringCSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringPublicationRequest' } } } }
      responses:
        '200': { description: Immutable CourseVersion publication result, content: { application/json: { schema: { $ref: '#/components/schemas/AuthoringPublication' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'Stale Review revision, non-approved Review, publication provenance conflict, or foreign Course/SemVer conflict', content: { application/problem+json: { schema: { $ref: '#/components/schemas/PublicationConflictProblem' } } } }
        '422': { description: Deterministic publication-readiness issues from the frozen Review snapshot, content: { application/problem+json: { schema: { $ref: '#/components/schemas/PublicationValidationProblem' } } } }
        '500': { $ref: '#/components/responses/Problem' }
  /api/courses:
    get:
      operationId: listPublishedCourses
      responses:
        '200':
          description: Discoverable courses and preferred published versions
          content: { application/json: { schema: { $ref: '#/components/schemas/CourseList' } } }
        '500': { $ref: '#/components/responses/Problem' }
  /api/courses/{slug}:
    get:
      operationId: getCurrentCourse
      parameters: [{ $ref: '#/components/parameters/CourseSlug' }]
      responses:
        '200': { description: Preferred published course, content: { application/json: { schema: { $ref: '#/components/schemas/CourseDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/courses/{slug}/versions/{version}:
    get:
      operationId: getCourseVersion
      parameters: [{ $ref: '#/components/parameters/CourseSlug' }, { $ref: '#/components/parameters/CourseVersion' }]
      responses:
        '200': { description: Explicit servable historical or published version, content: { application/json: { schema: { $ref: '#/components/schemas/CourseDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/courses/{slug}/versions/{version}/lessons/{lessonKey}:
    get:
      operationId: getPublishedLesson
      parameters: [{ $ref: '#/components/parameters/CourseSlug' }, { $ref: '#/components/parameters/CourseVersion' }, { $ref: '#/components/parameters/LessonKey' }]
      responses:
        '200': { description: Canonical published lesson content, content: { application/json: { schema: { $ref: '#/components/schemas/LessonDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/auth/login:
    post:
      operationId: loginWithPassword
      description: Authenticate a local password and set the opaque HttpOnly session cookie. A trusted same-origin Origin header is required; the response includes a separate session-bound CSRF token. Source rate limiting and bounded concurrent authentication work may reject requests before password verification. The response is not cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; opaque token is returned only in the Set-Cookie header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          description: Source login rate exceeded or authentication work saturated. Retry-After is provided when source refill time is known.
          headers:
            Retry-After:
              description: Whole seconds until the source bucket can admit another attempt; absent for other admission failures.
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/auth/logout:
    post:
      operationId: logoutCurrentSession
      description: Revoke the resolved current session and clear the cookie. A valid session requires its X-CSRF-Token header and a trusted same-origin Origin. Absent or invalid sessions may clear the cookie without a CSRF token, but Origin is still required. The response is not cacheable.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Logged out; session cookie cleared
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/auth/session:
    get:
      operationId: getCurrentSession
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current authenticated session and its synchronizer CSRF token; response is not cacheable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/admin/status:
    get:
      operationId: getAdministratorStatus
      description: Read-only proof of the instance.manage capability. Each request resolves the current session and active global role before authorization. No Administration mutation is exposed.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current actor may manage the instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatus'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Critical dependencies and schema are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    AuthoringOrigin: { name: Origin, in: header, required: true, schema: { type: string }, description: Trusted application Origin required for browser mutations. }
    AuthoringCSRFToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string }, description: CSRF token bound to the authenticated session. }
    AuthoringDraftID: { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringUserID: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringModuleID: { name: moduleId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringLessonID: { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
    AuthoringReviewID: { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
    CourseSlug: { name: slug, in: path, required: true, schema: { type: string } }
    CourseVersion: { name: version, in: path, required: true, schema: { type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$' } }
    LessonKey: { name: lessonKey, in: path, required: true, schema: { type: string } }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when a valid btg_session cookie is present. Use the csrf_token from a no-store login or current-session response. This token is not an authentication credential.
      schema: { type: string }
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: btg_session
      description: Opaque server-side session token; HttpOnly, SameSite=Lax, Secure in production.
  responses:
    Problem:
      description: RFC 9457 Problem Details with request correlation ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AuthoringReviewSubmitRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision]
      properties: { expectedDraftRevision: { type: integer, minimum: 1 } }
    AuthoringReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedReviewRevision]
      properties:
        expectedReviewRevision: { type: integer, minimum: 1 }
        message: { type: string, maxLength: 20000 }
    AuthoringPublicationRequest:
      type: object
      additionalProperties: false
      required: [expectedReviewRevision]
      properties: { expectedReviewRevision: { type: integer, minimum: 1 } }
    AuthoringPublication:
      type: object
      additionalProperties: false
      required: [reviewId, reviewRevision, courseId, courseVersion, courseVersionId, publishedAt]
      properties:
        reviewId: { type: string, format: uuid }
        reviewRevision: { type: integer, minimum: 1 }
        courseId: { type: string, format: uuid }
        courseVersion: { type: string, pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$' }
        courseVersionId: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
    PublicationValidationIssue:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code: { type: string, description: Stable publication-validation issue code. }
        path: { type: string, description: Deterministic canonical Review snapshot location. }
        message: { type: string, description: Safe human-readable issue detail. }
    PublicationValidationProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [code, issues]
          properties:
            code: { type: string, const: publication_validation_failed }
            issues: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PublicationValidationIssue' } }
    PublicationConflictProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [review_revision_conflict, review_not_approved, course_version_already_exists, publication_conflict]
    AuthoringReview:
      type: object
      additionalProperties: false
      required: [id, draftId, draftRevision, snapshotSchemaVersion, status, reviewRevision, submittedBy, submittedAt, decidedBy, decidedAt]
      properties:
        id: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        draftRevision: { type: integer, minimum: 1 }
        snapshotSchemaVersion: { type: integer, const: 1 }
        status: { type: string, enum: [IN_REVIEW, APPROVED, CHANGES_REQUESTED] }
        reviewRevision: { type: integer, minimum: 1 }
        submittedBy: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
    AuthoringReviewList:
      type: object
      additionalProperties: false
      required: [reviews]
      properties: { reviews: { type: array, items: { $ref: '#/components/schemas/AuthoringReview' } } }
    AuthoringReviewDetail:
      type: object
      additionalProperties: false
      required: [review, snapshot]
      properties:
        review: { $ref: '#/components/schemas/AuthoringReview' }
        snapshot: { $ref: '#/components/schemas/AuthoringReviewSnapshot' }
    AuthoringReviewSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, draft, modules]
      properties:
        schemaVersion: { type: integer, const: 1 }
        draft: { $ref: '#/components/schemas/AuthoringReviewSnapshotDraft' }
        modules: { type: array, items: { $ref: '#/components/schemas/AuthoringReviewSnapshotModule' } }
    AuthoringReviewSnapshotDraft:
      type: object
      additionalProperties: false
      required: [id, revision, courseId, intendedVersion, sourceLanguage, title, description, objectives, changelog, license]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        courseId: { type: string, format: uuid }
        intendedVersion: { type: string }
        sourceLanguage: { type: string }
        title: { type: string }
        description: { type: string }
        objectives: { type: array, items: { type: string } }
        changelog: { type: string }
        license:
          type: object
          additionalProperties: false
          required: [Kind, Identifier, DisplayName, URL, CustomText]
          properties:
            Kind: { type: string, enum: [STANDARD, ALL_RIGHTS_RESERVED, CUSTOM] }
            Identifier: { type: string }
            DisplayName: { type: string }
            URL: { type: string }
            CustomText: { type: string }
    AuthoringReviewSnapshotModule:
      type: object
      additionalProperties: false
      required: [id, stableKey, title, description, position, lessons]
      properties:
        id: { type: string, format: uuid }
        stableKey: { type: string }
        title: { type: string }
        description: { type: string }
        position: { type: integer, minimum: 0 }
        lessons: { type: array, items: { $ref: '#/components/schemas/AuthoringReviewSnapshotLesson' } }
    AuthoringReviewSnapshotLesson:
      type: object
      additionalProperties: false
      required: [id, stableKey, title, description, objectives, estimatedDurationMinutes, position, prerequisiteStableKeys, content]
      properties:
        id: { type: string, format: uuid }
        stableKey: { type: string }
        title: { type: string }
        description: { type: string }
        objectives: { type: array, items: { type: string } }
        estimatedDurationMinutes: { type: [integer, 'null'] }
        position: { type: integer, minimum: 0 }
        prerequisiteStableKeys: { type: array, items: { type: string } }
        content: { $ref: '#/components/schemas/LessonContent' }
    AuthoringActiveMember:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
    AuthoringActiveMemberList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/AuthoringActiveMember' }
    AuthoringMemberAddRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, userId, role]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
    AuthoringMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, role]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
    AuthoringMemberRevokeRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
    AuthoringMemberMutationResponse:
      type: object
      required: [id, userId, role, createdAt, revokedAt, draftRevision]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [AUTHOR, MAINTAINER] }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        draftRevision: { type: integer, minimum: 1 }
    AuthoringLessonCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, stableKey, title, description, objectives, position]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        stableKey: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimatedDurationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0 }
    AuthoringLessonUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedLessonRevision]
      anyOf:
        - required: [title]
        - required: [description]
        - required: [objectives]
        - required: [estimatedDurationMinutes]
      properties:
        expectedLessonRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimatedDurationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
    AuthoringLessonOrderModule:
      type: object
      additionalProperties: false
      required: [moduleId, lessonIds]
      properties:
        moduleId: { type: string, format: uuid }
        lessonIds: { type: array, maxItems: 10000, uniqueItems: true, items: { type: string, format: uuid } }
    AuthoringLessonReorderRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, modules]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        modules: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/AuthoringLessonOrderModule' } }
    AuthoringLessonPrerequisitesRequest:
      type: object
      additionalProperties: false
      required: [expectedLessonRevision, prerequisiteLessonKeys]
      properties:
        expectedLessonRevision: { type: integer, minimum: 1 }
        prerequisiteLessonKeys: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, minLength: 3, maxLength: 96 } }
    AuthoringLessonDeleteRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, expectedLessonRevision]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        expectedLessonRevision: { type: integer, minimum: 1 }
    AuthoringLessonContentUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedLessonRevision, content]
      properties:
        expectedLessonRevision: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/LessonContent' }
    AuthoringLessonContentMutationResponse:
      type: object
      required: [lesson, content]
      properties:
        lesson: { $ref: '#/components/schemas/AuthoringLessonMutationResponse' }
        content: { $ref: '#/components/schemas/LessonContent' }
    AuthoringLessonMutationResponse:
      type: object
      required: [id, draft_id, module_id, stable_key, title, description, objectives, estimated_duration_minutes, position, revision, draftRevision]
      properties:
        id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        module_id: { type: string, format: uuid }
        stable_key: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimated_duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        draftRevision: { type: integer, minimum: 1 }
    AuthoringModuleCreateRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, stableKey, title, position]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        stableKey: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        position: { type: integer, minimum: 0 }
    AuthoringModuleUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedModuleRevision]
      anyOf:
        - required: [title]
        - required: [description]
      properties:
        expectedModuleRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
    AuthoringModuleReorderRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, moduleIds]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        moduleIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string, format: uuid } }
    AuthoringModuleDeleteRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftRevision, expectedModuleRevision]
      properties:
        expectedDraftRevision: { type: integer, minimum: 1 }
        expectedModuleRevision: { type: integer, minimum: 1 }
    AuthoringModuleMutationResponse:
      type: object
      required: [module, draftRevision]
      properties:
        module: { $ref: '#/components/schemas/AuthoringModuleSummary' }
        draftRevision: { type: integer, minimum: 1 }
    AuthoringModuleOrderResponse:
      type: object
      required: [draftRevision]
      properties: { draftRevision: { type: integer, minimum: 1 } }
    AuthoringDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      anyOf:
        - required: [intendedVersion]
        - required: [sourceLanguage]
        - required: [title]
        - required: [description]
        - required: [objectives]
        - required: [changelog]
        - required: [license]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        intendedVersion: { type: string, pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$' }
        sourceLanguage: { type: string, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        changelog: { type: string, minLength: 1, maxLength: 20000 }
        license: { $ref: '#/components/schemas/ContentLicense' }
    AuthoringDraft:
      type: object
      required: [id, course_id, intended_version, source_language, title, description, objectives, changelog, license, status, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        intended_version: { type: string, pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$' }
        source_language: { type: string, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        changelog: { type: string, minLength: 1, maxLength: 20000 }
        license: { $ref: '#/components/schemas/ContentLicense' }
        status: { type: string, enum: [ACTIVE, ABANDONED] }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuthoringDraftSummary:
      type: object
      additionalProperties: false
      required: [id, title, intendedVersion, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 240 }
        intendedVersion: { type: string, pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$' }
        status: { type: string, enum: [ACTIVE, ABANDONED] }
        updatedAt: { type: string, format: date-time }
    AuthoringDraftList:
      type: object
      additionalProperties: false
      required: [drafts]
      properties:
        drafts: { type: array, items: { $ref: '#/components/schemas/AuthoringDraftSummary' } }
    AuthoringWorkspace:
      type: object
      required: [id, draft_id, created_at, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
    AuthoringLessonSummary:
      type: object
      required: [id, stable_key, title, description, objectives, estimated_duration_minutes, position, revision, recommended_prerequisite_keys]
      properties:
        id: { type: string, format: uuid }
        stable_key: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        objectives: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 1000 } }
        estimated_duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        recommended_prerequisite_keys: { type: array, items: { type: string } }
    AuthoringModuleSummary:
      type: object
      required: [id, stable_key, title, description, position, revision, lessons]
      properties:
        id: { type: string, format: uuid }
        stable_key: { type: string, minLength: 3, maxLength: 96, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
