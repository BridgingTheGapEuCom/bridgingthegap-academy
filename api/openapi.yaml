    AuthoringStructure:
      type: object
      required: [modules]
      properties: { modules: { type: array, items: { $ref: '#/components/schemas/AuthoringModuleSummary' } } }
    AuthoringLessonDetail:
      allOf:
        - $ref: '#/components/schemas/AuthoringLessonSummary'
        - type: object
          required: [draft_id, module_id, content, created_at, updated_at]
          properties:
            draft_id: { type: string, format: uuid }
            module_id: { type: string, format: uuid }
            content: { $ref: '#/components/schemas/LessonContent' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CourseList: { type: object, required: [courses], properties: { courses: { type: array, items: { $ref: '#/components/schemas/CourseSummary' } } } }
    CourseSummary: { type: object, required: [slug, version], properties: { slug: { type: string }, version: { $ref: '#/components/schemas/CourseVersionSummary' } } }
    CourseIdentity: { type: object, required: [slug], properties: { slug: { type: string } } }
    CourseDetail: { type: object, required: [course, version, modules], properties: { course: { $ref: '#/components/schemas/CourseIdentity' }, version: { $ref: '#/components/schemas/CourseVersionSummary' }, modules: { type: array, items: { $ref: '#/components/schemas/ModuleStructure' } } } }
    CourseVersionSummary: { type: object, required: [version, status, title, description, objectives, source_language, license, contributors], properties: { version: { type: string }, status: { type: string, enum: [PUBLISHED, DEPRECATED, ARCHIVED] }, title: { type: string }, description: { type: string }, objectives: { type: array, items: { type: string } }, source_language: { type: string }, license: { $ref: '#/components/schemas/ContentLicense' }, contributors: { type: array, items: { $ref: '#/components/schemas/Contributor' } } } }
    Contributor: { type: object, required: [display_name, role, order], properties: { display_name: { type: string }, role: { type: string, enum: [AUTHOR, MAINTAINER] }, order: { type: integer, minimum: 0 } } }
    ContentLicense: { type: object, required: [kind, identifier, display_name, url, custom_text], properties: { kind: { type: string, enum: [STANDARD, ALL_RIGHTS_RESERVED, CUSTOM] }, identifier: { type: string }, display_name: { type: string }, url: { type: string, description: Empty when no public license URL is present. }, custom_text: { type: string } } }
    ModuleSummary: { type: object, required: [key, title, description, position], properties: { key: { type: string }, title: { type: string }, description: { type: string }, position: { type: integer, minimum: 0 } } }
    LessonSummary: { type: object, required: [key, title, description, objectives, estimated_duration_minutes, position, recommended_prerequisite_keys], properties: { key: { type: string }, title: { type: string }, description: { type: string }, objectives: { type: array, items: { type: string } }, estimated_duration_minutes: { type: [integer, 'null'], minimum: 1 }, position: { type: integer, minimum: 0 }, recommended_prerequisite_keys: { type: array, items: { type: string } } } }
    ModuleStructure: { type: object, required: [module, lessons], properties: { module: { $ref: '#/components/schemas/ModuleSummary' }, lessons: { type: array, items: { $ref: '#/components/schemas/LessonSummary' } } } }
    LessonDetail: { type: object, required: [course, version, module, lesson], properties: { course: { $ref: '#/components/schemas/CourseIdentity' }, version: { $ref: '#/components/schemas/CourseVersionSummary' }, module: { $ref: '#/components/schemas/ModuleSummary' }, lesson: { allOf: [{ $ref: '#/components/schemas/LessonSummary' }, { type: object, required: [content], properties: { content: { $ref: '#/components/schemas/LessonContent' } } }] } } }
    LessonContent: { type: object, required: [schemaVersion, blocks], properties: { schemaVersion: { type: integer, const: 1 }, blocks: { type: array, items: { $ref: '#/components/schemas/LessonBlock' } } } }
    LessonBlock:
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/HeadingBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/VideoBlock'
        - $ref: '#/components/schemas/AudioBlock'
        - $ref: '#/components/schemas/CodeBlock'
        - $ref: '#/components/schemas/QuoteBlock'
        - $ref: '#/components/schemas/CalloutBlock'
        - $ref: '#/components/schemas/TableBlock'
        - $ref: '#/components/schemas/DownloadBlock'
        - $ref: '#/components/schemas/KnowledgeCheckBlock'
        - $ref: '#/components/schemas/DividerBlock'
      discriminator:
        propertyName: type
        mapping:
          TEXT: '#/components/schemas/TextBlock'
          HEADING: '#/components/schemas/HeadingBlock'
          IMAGE: '#/components/schemas/ImageBlock'
          VIDEO: '#/components/schemas/VideoBlock'
          AUDIO: '#/components/schemas/AudioBlock'
          CODE: '#/components/schemas/CodeBlock'
          QUOTE: '#/components/schemas/QuoteBlock'
          CALLOUT: '#/components/schemas/CalloutBlock'
          TABLE: '#/components/schemas/TableBlock'
          DOWNLOAD: '#/components/schemas/DownloadBlock'
          KNOWLEDGE_CHECK: '#/components/schemas/KnowledgeCheckBlock'
          DIVIDER: '#/components/schemas/DividerBlock'
    BlockEnvelope: { type: object, required: [key, type, payload], properties: { key: { type: string }, type: { type: string } } }
    TextBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: TEXT }, payload: { type: object, required: [content], properties: { content: { $ref: '#/components/schemas/RichText' } } } } }] }
    HeadingBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: HEADING }, payload: { type: object, required: [level, content], properties: { level: { type: integer, minimum: 2, maximum: 4 }, content: { type: array, items: { $ref: '#/components/schemas/RichTextInline' } } } } } }] }
    AssetReference: { type: object, required: [assetKey], properties: { assetKey: { type: string } } }
    ImageBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: IMAGE }, payload: { type: object, required: [asset, decorative], properties: { asset: { $ref: '#/components/schemas/AssetReference' }, altText: { type: string }, decorative: { type: boolean }, caption: { type: string } } } } }] }
    VideoBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: VIDEO }, payload: { type: object, required: [asset, title, captionsAsset], properties: { asset: { $ref: '#/components/schemas/AssetReference' }, title: { type: string }, transcript: { type: string }, transcriptAsset: { $ref: '#/components/schemas/AssetReference' }, captionsAsset: { $ref: '#/components/schemas/AssetReference' } } } } }] }
    AudioBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: AUDIO }, payload: { type: object, required: [asset, title], properties: { asset: { $ref: '#/components/schemas/AssetReference' }, title: { type: string }, transcript: { type: string }, transcriptAsset: { $ref: '#/components/schemas/AssetReference' } } } } }] }
    CodeBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: CODE }, payload: { type: object, required: [code], properties: { code: { type: string }, language: { type: string }, title: { type: string } } } } }] }
    QuoteBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: QUOTE }, payload: { type: object, required: [text], properties: { text: { type: string }, attribution: { type: string }, sourceUrl: { type: string, format: uri-reference } } } } }] }
    CalloutBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: CALLOUT }, payload: { type: object, required: [kind, content], properties: { kind: { type: string, enum: [INFO, NOTE, WARNING, TIP] }, title: { type: string }, content: { $ref: '#/components/schemas/RichText' } } } } }] }
    TableBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: TABLE }, payload: { type: object, required: [headers, rows], properties: { caption: { type: string }, headers: { type: array, items: { type: string } }, rows: { type: array, items: { type: array, items: { type: string } } } } } } }] }
    DownloadBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: DOWNLOAD }, payload: { type: object, required: [asset, label], properties: { asset: { $ref: '#/components/schemas/AssetReference' }, label: { type: string }, description: { type: string } } } } }] }
    KnowledgeCheckBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: KNOWLEDGE_CHECK }, payload: { type: object, required: [assessmentKey], properties: { assessmentKey: { type: string } } } } }] }
    DividerBlock: { allOf: [{ $ref: '#/components/schemas/BlockEnvelope' }, { type: object, required: [payload], properties: { type: { const: DIVIDER }, payload: { type: object } } }] }
    RichText: { type: object, description: Constrained semantic rich text. It is not HTML or editor state., required: [nodes], properties: { nodes: { type: array, items: { $ref: '#/components/schemas/RichTextNode' } } } }
    RichTextNode: { type: object, properties: { type: { type: string, enum: [paragraph, bullet_list, ordered_list] }, content: { type: array, items: { $ref: '#/components/schemas/RichTextInline' } }, items: { type: array, items: { type: array, items: { $ref: '#/components/schemas/RichTextInline' } } } } }
    RichTextInline: { type: object, properties: { type: { type: string, enum: [text, hard_break] }, text: { type: string }, marks: { type: array, items: { $ref: '#/components/schemas/RichTextMark' } } } }
    RichTextMark: { type: object, required: [type], properties: { type: { type: string, enum: [emphasis, strong, inline_code, link] }, href: { type: string, format: uri-reference } } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, format: password, writeOnly: true }
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [authenticated, user_id, expires_at, csrf_token]
      properties:
        authenticated: { type: boolean, const: true }
        user_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        csrf_token:
          type: string
          description: Session-bound synchronizer token. Keep in memory and send as X-CSRF-Token on cookie-authenticated POST, PUT, PATCH, and DELETE requests. Not an authentication credential.
    AdminStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Problem:
      type: object
      required: [type, title, status, instance, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        instance: { type: string }
        request_id: { type: string }
        code:
          type: string
          description: Stable machine-readable code for a public, specific problem condition when present.
